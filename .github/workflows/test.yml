name: test

on:
  push:
  pull_request:

jobs:
  test:
    # Windows: the codec round-trip runs the real capture.ps1 decoder.
    # Linux: it runs the capture_x11.py decoder (python3 is on the runner).
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
